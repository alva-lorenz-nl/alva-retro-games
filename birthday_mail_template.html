<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    background-color: #f7fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 30px 15px;
    color: #2d3748;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    overflow: hidden;
  }
  .banner {
    background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 100%);
    padding: 35px 20px 25px;
    text-align: center;
  }
  .svg-box {
    display: inline-block;
    filter: drop-shadow(0 6px 12px rgba(99, 102, 241, 0.15));
  }
  /* 尾巴摇晃动画 */
  @keyframes catTailSwing {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(18deg); }
    100% { transform: rotate(0deg); }
  }
  /* 耳朵轻微动一动 */
  @keyframes catEarTwitch {
    0%, 90%, 100% { transform: rotate(0deg); }
    94% { transform: rotate(-6deg); }
    98% { transform: rotate(4deg); }
  }
  /* 眼睛眨巴 */
  @keyframes catBlink {
    0%, 94%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.1); }
  }
  .tail-anim {
    transform-origin: 90px 115px;
    animation: catTailSwing 2s ease-in-out infinite;
  }
  .ear-anim {
    transform-origin: 55px 45px;
    animation: catEarTwitch 4s ease-in-out infinite;
  }
  .eye-anim {
    transform-origin: center;
    animation: catBlink 3.5s infinite;
  }
  .content {
    padding: 32px 36px 40px;
    line-height: 1.8;
  }
  .content h2 {
    margin-top: 0;
    color: #1e293b;
    font-size: 20px;
    font-weight: 600;
  }
  .content p {
    margin: 14px 0;
    color: #475569;
    font-size: 15px;
  }
  .sign {
    margin-top: 30px;
    text-align: right;
    color: #64748b;
    font-size: 14px;
    border-top: 1px dashed #e2e8f0;
    padding-top: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="banner">
      <div class="svg-box">
        <svg width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- 阴影 -->
          <ellipse cx="75" cy="138" rx="42" ry="8" fill="#cbd5e1" opacity="0.6"/>

          <!-- 翘起的尾巴 (独立组挂载摇动动画) -->
          <g class="tail-anim">
            <path d="M 92 118 Q 125 105 118 68 Q 114 48 102 38 Q 94 40 98 52 Q 106 72 88 114 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
          </g>

          <!-- 猫咪后躯干 -->
          <ellipse cx="75" cy="108" rx="36" ry="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

          <!-- 左耳 -->
          <g class="ear-anim">
            <path d="M 45 62 L 40 32 L 62 48 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 46 56 L 43 38 L 57 48 Z" fill="#fbcfe8"/>
          </g>

          <!-- 右耳 -->
          <path d="M 88 48 L 110 32 L 105 62 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
          <path d="M 93 48 L 107 38 L 104 56 Z" fill="#fbcfe8"/>

          <!-- 猫咪大圆脑袋 -->
          <ellipse cx="75" cy="72" rx="34" ry="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

          <!-- 蓝汪汪的大眼睛 -->
          <g class="eye-anim">
            <ellipse cx="61" cy="68" rx="5" ry="6" fill="#38bdf8"/>
            <circle cx="59.5" cy="66" r="2" fill="#ffffff"/>
            <ellipse cx="89" cy="68" rx="5" ry="6" fill="#38bdf8"/>
            <circle cx="87.5" cy="66" r="2" fill="#ffffff"/>
          </g>

          <!-- 粉嫩小鼻子与嘴巴 -->
          <polygon points="75,76 72,73 78,73" fill="#f472b6"/>
          <path d="M 72 78 Q 75 81 75 77 Q 75 81 78 78" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" fill="none"/>

          <!-- 脸颊害羞粉晕 -->
          <ellipse cx="52" cy="76" rx="4" ry="2.5" fill="#fbcfe8" opacity="0.8"/>
          <ellipse cx="98" cy="76" rx="4" ry="2.5" fill="#fbcfe8" opacity="0.8"/>

          <!-- 胡须 -->
          <line x1="48" y1="73" x2="32" y2="70" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="48" y1="76" x2="34" y2="78" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="102" y1="73" x2="118" y2="70" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="102" y1="76" x2="116" y2="78" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

          <!-- 胸前小抓手 -->
          <ellipse cx="66" cy="126" rx="7" ry="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
          <ellipse cx="84" cy="126" rx="7" ry="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <div class="content">
      <h2>亲爱的小毛球：</h2>
      <p>祝你生日快乐！</p>
      <p>愿你新的一岁像这只小白猫一样无忧无虑，每天都能吃到最喜欢的罐头，晒着最暖和的太阳。</p>
      <div class="sign">
        —— 永远惦记你的：喵喵狐 (小雪球)
      </div>
    </div>
  </div>
</body>
</html>
