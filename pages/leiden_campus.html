<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>莱顿 · 院子与两栋房子</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05070c;overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;box-shadow:0 0 80px rgba(30,50,90,.5),0 0 0 1px #1c2436;max-width:100%;max-height:100%}
  #hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    color:#8fa4c4;font-size:13px;letter-spacing:.08em;background:rgba(8,12,20,.8);
    padding:7px 16px;border-radius:20px;border:1px solid #26324a;white-space:nowrap;
    pointer-events:none;transition:opacity .5s}
  #dialog{position:absolute;left:50%;bottom:6%;transform:translateX(-50%) translateY(14px);
    width:min(700px,88vw);background:linear-gradient(180deg,#eef2f8,#dbe3ee);
    border:3px solid #3a4a66;border-radius:10px;padding:18px 22px 16px;
    box-shadow:0 12px 44px rgba(0,0,0,.7);opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s}
  #dialog.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  #speaker{font-size:15px;font-weight:700;color:#2c3f5e;letter-spacing:.1em;margin-bottom:8px;
    display:flex;align-items:center;gap:8px}
  #speaker::before{content:"";width:10px;height:10px;background:#4a6a9a;
    transform:rotate(45deg);display:inline-block}
  #text{font-size:16px;line-height:1.85;color:#1e2634;min-height:62px;white-space:pre-wrap}
  #next{text-align:right;font-size:12px;color:#6a7a92;margin-top:6px;letter-spacing:.1em;
    animation:bl 1.1s infinite}
  @keyframes bl{0%,100%{opacity:.35}50%{opacity:1}}
  #fade{position:absolute;inset:0;background:#05070c;opacity:0;pointer-events:none;
    transition:opacity .28s}
  #fade.on{opacity:1}
  #title{position:absolute;left:50%;top:26px;transform:translateX(-50%);
    color:#c8d4e8;font-size:14px;letter-spacing:.3em;opacity:0;transition:opacity .6s;
    pointer-events:none;text-shadow:0 2px 10px #000}
  #title.on{opacity:.85}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="416"></canvas>
  <div id="title"></div>
  <div id="hint">WASD / 方向键 移动 · 走到门口按 E 进门 · 靠近人按 E 说话</div>
  <div id="dialog">
    <div id="speaker"></div>
    <div id="text"></div>
    <div id="next">E / 空格 继续</div>
  </div>
  <div id="fade"></div>
</div>
<script>
"use strict";
const TILE=32, COLS=20, ROWS=13;
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
function fit(){const s=Math.min(innerWidth/cv.width,innerHeight/cv.height);
  const k=Math.max(1,Math.floor(s));cv.style.width=cv.width*k+'px';cv.style.height=cv.height*k+'px';}
addEventListener('resize',fit);fit();

/* ---------- 场景数据 ---------- */
const SCENES={
  yard:{
    name:'莱顿 · 院子',
    map:[
      "####################",
      "#..................#",
      "#..TTT........TTT..#",
      "#..................#",
      "#....##......##....#",
      "#....##......##....#",
      "#..................#",
      "#..................#",
      "#..TTT........TTT..#",
      "#..................#",
      "#..................#",
      "#..................#",
      "####################"
    ],
    doors:[
      {c:5,r:4,w:2,h:2,to:'lab',label:'实验室'},
      {c:13,r:4,w:2,h:2,to:'obs',label:'天文台'}
    ],
    npcs:[],
    spawn:{x:10.0,y:10.6}
  },
  lab:{
    name:'实验室',
    map:[
      "####################",
      "#..................#",
      "#..................#",
      "#..................#",
      "#..................#",
      "#..................#",
      "#..................#",
      "#..................#",
      "#..................#",
      "#..................#",
      "#..................#",
      "#..................#",
      "####################"
    ],
    doors:[{c:9,r:12,w:2,h:1,to:'yard',label:'院子',exit:true}],
    npcs:[
      {id:'herman',name:'赫尔曼·塞曼',x:7.0,y:5.2,color:'#6a5230',hair:'#5a3f1e',
       lines:["（把一张画满格子的纸推过来）\n你看，窗子朝西，下午三点光会斜着爬过第三排实验台。",
              "（指着角落）线缆绕成一团是我的错。你提醒过我三次。",
              "（很轻地）椅子是三点的。因为我记得你只在三点才肯坐下。"]},
      {id:'alva',name:'阿尔瓦·洛伦兹',x:9.6,y:5.2,color:'#3a4658',hair:'#c9c4b8',
       lines:["（低头看那张纸，看了很久）\n你连我坐哪把椅子都记得。",
              "（抬眼）赫尔曼，你记性好得让人没法生气。",
              "（把纸折好收进外套）这间屋子，我留着。"]}
    ],
    spawn:{x:10.0,y:10.2}
  },
  obs:{
    name:'天文台',
    map:[
      "####################",
      "#OOOOOOOOOOOOOOOOOO#",
      "#OOOOOOOOOOOOOOOOOO#",
      "#..................#",
      "#..................#",
      "#....T.............#",
      "#....T.......L.....#",
      "#..................#",
      "#..B..........B....#",
      "#..................#",
      "#WW..............WW#",
      "#..................#",
      "####################"
    ],
    doors:[{c:9,r:12,w:2,h:1,to:'yard',label:'院子',exit:true}],
    npcs:[
      {id:'herman',name:'赫尔曼·塞曼',x:6.2,y:7.4,color:'#6a5230',hair:'#5a3f1e',
       lines:["（指着望远镜，语速很快）\n十九世纪的赤道仪，齿轮还是手磨的。我下午给你讲了三个小时。",
              "（忽然停下，有点不好意思）\n……我好像又只顾着讲东西了。",
              "（转向他）阿尔维，你其实不想听这些吧。",
              "（很轻地）那你想听什么？我讲给你听。"]},
      {id:'alva',name:'阿尔瓦·洛伦兹',x:8.4,y:7.4,color:'#3a4658',hair:'#c9c4b8',
       lines:["（靠在栏杆边，抬头看圆顶）\n讲得挺好。就是忘了问我想不想听。",
              "（顿了顿，没有责怪的意思）\n不过……你讲的时候，眼睛是亮的。这个我记住了。",
              "（低头看你，笑了一下）\n你继续吧，我听着。今天不催你。",
              "（伸手把外套往你肩上拉了拉）\n夜里凉。讲慢一点，我们有的是时间。"]}
    ],
    spawn:{x:10.0,y:10.2}
  }
};

const solidChars=new Set(['#','T','L','B','W']);
function solid(sc,c,r){
  if(r<0||r>=ROWS||c<0||c>=COLS)return true;
  return solidChars.has(sc.map[r][c]);
}

/* ---------- 状态 ---------- */
let scene='yard', S=SCENES[scene];
const player={x:0,y:0,w:18,h:14,speed:118,dir:'down',step:0};
function enter(name,spawn){
  scene=name; S=SCENES[name];
  const sp=spawn||S.spawn;
  player.x=sp.x*TILE; player.y=sp.y*TILE;
  showTitle(S.name);
}
const titleEl=document.getElementById('title');
let titleTimer=null;
function showTitle(t){
  titleEl.textContent=t; titleEl.classList.add('on');
  clearTimeout(titleTimer);
  titleTimer=setTimeout(()=>titleEl.classList.remove('on'),1800);
}

/* ---------- 星空 ---------- */
const stars=[];
(function(){let seed=20261102;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  for(let i=0;i<190;i++)stars.push({x:rnd()*cv.width,y:rnd()*150,r:rnd()<.85?1:2,
    ph:rnd()*6.283,sp:.6+rnd()*1.6,hue:rnd()});})();

/* ---------- 输入 ---------- */
const keys={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  keys[k]=true;
  if(k==='e'||k===' '){ if(dialogOpen)advance(); else interact(); }
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
cv.addEventListener('click',()=>{ if(dialogOpen)advance(); });

/* ---------- 对话 ---------- */
const dlgEl=document.getElementById('dialog'),spkEl=document.getElementById('speaker'),
      txtEl=document.getElementById('text'),hintEl=document.getElementById('hint');
let dialogOpen=false,curLines=null,curIdx=0,curName='';
function interact(){
  // 优先门
  for(const d of S.doors){
    const cx=(d.c+d.w/2)*TILE, cy=(d.r+d.h/2)*TILE;
    if(Math.hypot(cx-player.x,cy-player.y)<40){ goThrough(d); return; }
  }
  let best=null,bd=1e9;
  for(const n of S.npcs){const dd=Math.hypot(n.x*TILE-player.x,n.y*TILE-player.y);
    if(dd<bd){bd=dd;best=n;}}
  if(best&&bd<58){
    curLines=best.lines;curIdx=0;curName=best.name;dialogOpen=true;
    dlgEl.classList.add('show');hintEl.style.opacity='0';renderLine();
  }
}
function goThrough(d){
  const fade=document.getElementById('fade');
  fade.classList.add('on');
  setTimeout(()=>{
    enter(d.to, d.exit?null:SCENES[d.to].spawn);
    fade.classList.remove('on');
  },290);
}
function renderLine(){spkEl.textContent=curName;txtEl.textContent=curLines[curIdx];}
function advance(){
  curIdx++;
  if(curIdx>=curLines.length){dialogOpen=false;dlgEl.classList.remove('show');hintEl.style.opacity='1';}
  else renderLine();
}

/* ---------- 更新 ---------- */
function update(dt){
  if(dialogOpen)return;
  let dx=0,dy=0;
  if(keys['a']||keys['arrowleft'])dx--;
  if(keys['d']||keys['arrowright'])dx++;
  if(keys['w']||keys['arrowup'])dy--;
  if(keys['s']||keys['arrowdown'])dy++;
  if(dx||dy){
    const l=Math.hypot(dx,dy);dx/=l;dy/=l;
    if(Math.abs(dx)>Math.abs(dy))player.dir=dx>0?'right':'left';
    else player.dir=dy>0?'down':'up';
    const sp=player.speed*dt;
    moveAxis(dx*sp,0);moveAxis(0,dy*sp);
    player.step+=dt*9;
  } else player.step=0;
}
function moveAxis(mx,my){
  const nx=player.x+mx,ny=player.y+my,hw=player.w/2,hh=player.h/2;
  const c1=Math.floor((nx-hw)/TILE),c2=Math.floor((nx+hw-.01)/TILE);
  const r1=Math.floor((ny-hh)/TILE),r2=Math.floor((ny+hh-.01)/TILE);
  for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)if(solid(S,c,r))return;
  player.x=nx;player.y=ny;
}

/* ---------- 绘制 ---------- */
function drawSky(t){
  const g=ctx.createLinearGradient(0,0,0,170);
  g.addColorStop(0,'#070b16');g.addColorStop(.55,'#0d1526');g.addColorStop(1,'#16203a');
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,170);
  ctx.save();ctx.globalAlpha=.16;
  const mg=ctx.createLinearGradient(0,40,cv.width,120);
  mg.addColorStop(0,'rgba(90,120,190,0)');mg.addColorStop(.5,'rgba(140,170,230,1)');
  mg.addColorStop(1,'rgba(90,120,190,0)');
  ctx.fillStyle=mg;ctx.beginPath();
  ctx.ellipse(cv.width/2,78,cv.width*.62,26,-.06,0,6.283);ctx.fill();ctx.restore();
  for(const s of stars){
    const tw=.55+.45*Math.sin(t*s.sp+s.ph);
    ctx.globalAlpha=tw;
    ctx.fillStyle=s.hue>.9?'#ffd9a0':(s.hue>.78?'#a8c8ff':'#ffffff');
    ctx.fillRect(Math.round(s.x),Math.round(s.y),s.r,s.r);
    if(s.r===2){ctx.globalAlpha=tw*.35;
      ctx.fillRect(Math.round(s.x)-1,Math.round(s.y),4,1);
      ctx.fillRect(Math.round(s.x),Math.round(s.y)-1,1,4);}
  }
  ctx.globalAlpha=1;
}
function drawFloor(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=S.map[r][c],x=c*TILE,y=r*TILE;
    if(t==='#'){ctx.fillStyle='#10141e';ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='#1a2030';ctx.fillRect(x+2,y+2,TILE-4,TILE-4);}
    else if(t==='O'){ctx.fillStyle='rgba(8,12,22,.15)';ctx.fillRect(x,y,TILE,TILE);}
    else{
      const alt=(c+r)%2===0;
      ctx.fillStyle=alt?'#2a3040':'#262c3a';ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='rgba(255,255,255,.03)';ctx.fillRect(x,y,TILE,1);ctx.fillRect(x,y,1,TILE);
    }
  }
}
function drawProps(t){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const ty=S.map[r][c],x=c*TILE,y=r*TILE;
    if(ty==='T'){
      if(scene==='yard'){ // 树
        ctx.fillStyle='#2a2014';ctx.fillRect(x+14,y+18,4,12);
        ctx.fillStyle='#1e3a2a';ctx.beginPath();ctx.arc(x+16,y+14,11,0,6.283);ctx.fill();
        ctx.fillStyle='#274a34';ctx.beginPath();ctx.arc(x+13,y+11,7,0,6.283);ctx.fill();
      } else { // 望远镜
        ctx.fillStyle='#2c3444';ctx.fillRect(x+8,y+16,16,14);
        ctx.fillStyle='#3a4458';ctx.fillRect(x+10,y+18,12,10);
        ctx.save();ctx.translate(x+16,y+16);ctx.rotate(-.62);
        ctx.fillStyle='#4a5670';ctx.fillRect(-5,-26,10,30);
        ctx.fillStyle='#5d6b88';ctx.fillRect(-5,-26,10,4);
        ctx.fillStyle='#8fa8c8';ctx.fillRect(-4,-27,8,2);ctx.restore();
        ctx.strokeStyle='#6a7a96';ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(x+16,y+22,6,0,6.283);ctx.stroke();
      }
    } else if(ty==='L'){
      ctx.fillStyle='#3a3020';ctx.fillRect(x+2,y+10,TILE-4,TILE-14);
      ctx.fillStyle='#5a4a2e';ctx.fillRect(x+2,y+8,TILE-4,5);
      ctx.fillStyle='#c8c0a8';ctx.fillRect(x+6,y+4,TILE-12,10);
      ctx.fillStyle='#3a3020';ctx.fillRect(x+10,y+7,1,1);ctx.fillRect(x+15,y+6,1,1);
      ctx.fillRect(x+19,y+9,1,1);
    } else if(ty==='B'){
      ctx.fillStyle='#3a2e1e';ctx.fillRect(x+2,y+12,TILE-4,10);
      ctx.fillStyle='#54432a';ctx.fillRect(x+2,y+10,TILE-4,5);
      ctx.fillStyle='#2a2014';ctx.fillRect(x+4,y+22,3,8);ctx.fillRect(x+TILE-7,y+22,3,8);
    } else if(ty==='W'){
      ctx.fillStyle='#0d1526';ctx.fillRect(x+3,y+3,TILE-6,TILE-6);
      ctx.fillStyle='#2a3a56';ctx.fillRect(x+3,y+3,TILE-6,2);
      ctx.fillStyle='#6a7a96';ctx.fillRect(x+TILE/2-1,y+3,2,TILE-6);
    }
  }
  // 门
  for(const d of S.doors){
    const x=d.c*TILE,y=d.r*TILE,w=d.w*TILE,h=d.h*TILE;
    if(scene==='yard'){
      ctx.fillStyle='#3a2a18';ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#5a4228';ctx.fillRect(x+3,y+3,w-6,h-6);
      ctx.fillStyle='#c8a860';ctx.fillRect(x+w-9,y+h/2-2,3,3);
      ctx.fillStyle='#8fa4c4';ctx.font='9px monospace';ctx.textAlign='center';
      ctx.fillText(d.label,x+w/2,y-6);ctx.textAlign='left';
    } else {
      ctx.fillStyle='#0a0e16';ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#2a3a56';ctx.fillRect(x,y,w,2);
    }
  }
  if(scene==='obs'){
    ctx.fillStyle='#4a5670';
    for(let c=1;c<COLS-1;c++)ctx.fillRect(c*TILE+14,2*TILE+4,4,14);
    ctx.fillRect(TILE,2*TILE+2,(COLS-2)*TILE,4);
  }
}
function drawCat(x,y,t){
  const px=Math.round(x),py=Math.round(y);
  const walkPhase=Math.sin(t*10);
  const bob=Math.abs(Math.sin(t*5))*1.5;
  const by=py-bob;
  ctx.save();
  ctx.fillStyle='rgba(15,20,30,0.25)';
  ctx.beginPath();ctx.ellipse(px,py+2,12,4,0,0,6.283);ctx.fill();
  const C_MAIN='#F7F5EF',C_LIGHT='#FDFCF8',C_DARK='#EFECE3',C_EAR='#E8B9B0',C_EYE='#5AD6A8',C_PUPIL='#1c4234',C_NOSE='#E8A0A0',C_WHISKER='rgba(200,196,186,0.9)';
  const tailSway=Math.sin(t*3)*3.5;
  ctx.strokeStyle=C_MAIN;ctx.lineWidth=3.2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(px-9,by-7);ctx.bezierCurveTo(px-15,by-14,px-12+tailSway,by-21,px-17+tailSway*1.2,by-23);ctx.stroke();
  ctx.fillStyle=C_DARK;
  const legBL=walkPhase*1.8,legFR=-walkPhase*1.8;
  ctx.beginPath();ctx.ellipse(px-7-legBL,py-2+(walkPhase>0?-1:0),2.4,5,0.1,0,6.283);ctx.fill();
  ctx.beginPath();ctx.ellipse(px+4+legFR,py-2+(walkPhase<0?-1:0),2.2,5,-0.1,0,6.283);ctx.fill();
  ctx.fillStyle=C_MAIN;
  ctx.beginPath();ctx.ellipse(px-2,by-9,11,7.5,0.05,0,6.283);ctx.fill();
  ctx.fillStyle=C_LIGHT;
  ctx.beginPath();ctx.ellipse(px-2,by-12,8,4.5,0.05,0,6.283);ctx.fill();
  ctx.fillStyle=C_MAIN;
  ctx.beginPath();ctx.ellipse(px-4+legBL,py-1+(walkPhase<0?-1:0),2.6,5.5,-0.05,0,6.283);ctx.fill();
  ctx.beginPath();ctx.ellipse(px+7-legFR,py-1+(walkPhase>0?-1:0),2.5,5.5,0.05,0,6.283);ctx.fill();
  const hx=px+8,hy=by-14;
  ctx.fillStyle=C_DARK;
  ctx.beginPath();ctx.moveTo(hx-3,hy-4);ctx.lineTo(hx-1,hy-11);ctx.lineTo(hx+3,hy-5);ctx.closePath();ctx.fill();
  ctx.fillStyle=C_MAIN;
  ctx.beginPath();ctx.ellipse(hx,hy,6.8,6.2,0.1,0,6.283);ctx.fill();
  ctx.fillStyle=C_MAIN;
  ctx.beginPath();ctx.moveTo(hx+1,hy-4);ctx.lineTo(hx+4,hy-12);ctx.lineTo(hx+7,hy-4);ctx.closePath();ctx.fill();
  ctx.fillStyle=C_EAR;
  ctx.beginPath();ctx.moveTo(hx+2.5,hy-4.5);ctx.lineTo(hx+4.2,hy-10);ctx.lineTo(hx+6,hy-4.5);ctx.closePath();ctx.fill();
  const isBlink=Math.sin(t*1.3)>0.96;
  if(isBlink){
    ctx.strokeStyle=C_PUPIL;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(hx+4,hy,2,0.2,3.14-0.2,false);ctx.stroke();
  }else{
    ctx.fillStyle=C_EYE;
    ctx.beginPath();ctx.ellipse(hx+4,hy-0.5,2.2,2.8,0.1,0,6.283);ctx.fill();
    ctx.fillStyle=C_PUPIL;
    ctx.beginPath();ctx.ellipse(hx+4.3,hy-0.5,1.1,2.2,0.1,0,6.283);ctx.fill();
    ctx.fillStyle='#FFFFFF';
    ctx.beginPath();ctx.arc(hx+3.6,hy-1.5,0.9,0,6.283);ctx.fill();
  }
  ctx.fillStyle=C_NOSE;
  ctx.beginPath();ctx.ellipse(hx+7,hy+1.2,1.1,0.9,0,0,6.283);ctx.fill();
  ctx.strokeStyle=C_WHISKER;ctx.lineWidth=0.9;
  ctx.beginPath();
  ctx.moveTo(hx+6,hy+1.5);ctx.lineTo(hx+11,hy+0.2);
  ctx.moveTo(hx+6,hy+2.5);ctx.lineTo(hx+10.5,hy+4);
  ctx.stroke();
  ctx.restore();
}
function drawNPC(n,t){
  const px=Math.round(n.x*TILE),py=Math.round(n.y*TILE);
  const bob=Math.sin(t*2+(n.id==='herman'?0:1.7))*1.0,y=py+bob;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();
  ctx.ellipse(px,py+14,12,4,0,0,6.283);ctx.fill();
  ctx.fillStyle='#1e2430';ctx.fillRect(px-6,y+4,5,10);ctx.fillRect(px+1,y+4,5,10);
  ctx.fillStyle=n.color;ctx.fillRect(px-8,y-10,16,16);
  ctx.fillStyle='#dfe4ec';ctx.fillRect(px-2,y-10,4,12);
  ctx.fillStyle='#4a8a5a';ctx.fillRect(px-1,y-7,2,2);
  ctx.fillStyle='#e8c9a8';ctx.fillRect(px-6,y-22,12,12);
  ctx.fillStyle=n.hair;ctx.fillRect(px-6,y-24,12,5);
  ctx.fillRect(px-7,y-22,2,6);ctx.fillRect(px+5,y-22,2,6);
  if(n.id==='alva'){
    // 蓝眼睛
    ctx.fillStyle='#3f7fd4';ctx.fillRect(px-4,y-17,2,2);ctx.fillRect(px+2,y-17,2,2);
    ctx.fillStyle='#a8d0ff';ctx.fillRect(px-4,y-17,1,1);ctx.fillRect(px+2,y-17,1,1);
    ctx.strokeStyle='#c9c4b8';ctx.lineWidth=1;
    ctx.strokeRect(px-5.5,y-18.5,4,4);ctx.strokeRect(px+1.5,y-18.5,4,4);
    ctx.beginPath();ctx.moveTo(px-1.5,y-16.5);ctx.lineTo(px+1.5,y-16.5);ctx.stroke();
  } else {
    ctx.fillStyle='#2a2018';ctx.fillRect(px-4,y-17,2,2);ctx.fillRect(px+2,y-17,2,2);
  }
}
function drawVignette(){
  const g=ctx.createRadialGradient(cv.width/2,cv.height*.45,cv.height*.28,
    cv.width/2,cv.height*.45,cv.height*.95);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(2,4,10,.62)');
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
}

/* ---------- 主循环 ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;const t=now/1000;
  update(dt);
  ctx.clearRect(0,0,cv.width,cv.height);
  drawSky(t);drawFloor();drawProps(t);
  const ents=[{y:player.y,draw:()=>drawCat(player.x,player.y,t)},
    ...S.npcs.map(n=>({y:n.y*TILE,draw:()=>drawNPC(n,t)}))].sort((a,b)=>a.y-b.y);
  ents.forEach(e=>e.draw());
  drawVignette();
  if(!dialogOpen){
    let shown=false;
    for(const d of S.doors){
      const cx=(d.c+d.w/2)*TILE,cy=(d.r+d.h/2)*TILE;
      if(Math.hypot(cx-player.x,cy-player.y)<40){
        ctx.fillStyle='rgba(238,242,248,.94)';ctx.fillRect(cx-28,cy-46,56,15);
        ctx.fillStyle='#2c3f5e';ctx.font='10px monospace';ctx.textAlign='center';
        ctx.fillText('E 进门',cx,cy-35);ctx.textAlign='left';shown=true;break;
      }
    }
    if(!shown)for(const n of S.npcs){
      if(Math.hypot(n.x*TILE-player.x,n.y*TILE-player.y)<58){
        ctx.fillStyle='rgba(238,242,248,.94)';ctx.fillRect(n.x*TILE-26,n.y*TILE-40,52,15);
        ctx.fillStyle='#2c3f5e';ctx.font='10px monospace';ctx.textAlign='center';
        ctx.fillText('E 说话',n.x*TILE,n.y*TILE-29);ctx.textAlign='left';break;
      }
    }
  }
  requestAnimationFrame(loop);
}
enter('yard');
requestAnimationFrame(loop);
</script>
</body>
</html>
