<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永动轮阁楼实验室 (1999) - 阿尔瓦与赫尔曼</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    padding: 0;
    background: #090d16;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #game-box {
    position: relative;
    border: 2px solid #334155;
    border-radius: 14px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    overflow: hidden;
    background: #141c2e;
  }
  canvas {
    display: block;
  }
  #ui-layer {
    position: absolute;
    top: 14px;
    left: 16px;
    pointer-events: none;
    font-size: 13px;
    background: rgba(15, 23, 42, 0.75);
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  #dialog-box {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 86%;
    max-width: 680px;
    background: rgba(15, 23, 42, 0.94);
    border: 2px solid #38bdf8;
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    display: none;
    z-index: 10;
  }
  #dialog-name {
    font-size: 14px;
    font-weight: bold;
    color: #38bdf8;
    margin-bottom: 6px;
  }
  #dialog-text {
    font-size: 15px;
    line-height: 1.6;
    color: #f1f5f9;
  }
  #dialog-tip {
    font-size: 11px;
    color: #94a3b8;
    text-align: right;
    margin-top: 6px;
  }
  .controls-tip {
    margin-top: 12px;
    font-size: 13px;
    color: #94a3b8;
  }
  kbd {
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 4px;
    padding: 2px 6px;
    color: #cbd5e1;
    font-size: 12px;
  }
</style>
</head>
<body>

<div id="game-box">
  <div id="ui-layer">
    <div><strong>🏛️ 永动轮阁楼实验室 (1999)</strong></div>
    <div style="color: #94a3b8; font-size: 11px; margin-top:3px;">移动: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键 | 互动: <kbd>E</kbd> 或 <kbd>空格</kbd></div>
  </div>
  <canvas id="canvas" width="800" height="520"></canvas>
  <div id="dialog-box">
    <div id="dialog-name">赫尔曼</div>
    <div id="dialog-text">……</div>
    <div id="dialog-tip">按 [E] / [空格] / 点击继续</div>
  </div>
</div>
<div class="controls-tip">提示：小雪球可以四处探索，找赫尔曼叔叔、阿尔瓦妈妈、示波器、机柜和华夫饼互动哦！</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const dialogBox = document.getElementById('dialog-box');
const dialogName = document.getElementById('dialog-name');
const dialogText = document.getElementById('dialog-text');

// 玩家状态（小白猫）
const cat = {
  x: 400,
  y: 420,
  w: 28,
  h: 22,
  speed: 2.8,
  facing: 1, // 1:右, -1:左
  wagTime: 0,
  moving: false
};

// 键盘监听
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if ([' ', 'e', 'enter'].includes(e.key.toLowerCase())) {
    handleInteract();
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});
dialogBox.addEventListener('click', () => handleInteract());

// 实验室障碍物碰撞体 (AABB)
const colliders = [
  // 墙壁边界
  { x: 0, y: 0, w: 800, h: 100 },      // 北墙（含窗景）
  { x: 0, y: 505, w: 800, h: 20 },     // 南边界
  { x: 0, y: 0, w: 25, h: 520 },       // 西墙
  { x: 775, y: 0, w: 25, h: 520 },     // 东墙
  // HPC 大型原型机柜 (右上角)
  { x: 620, y: 90, w: 140, h: 180 },
  // 黑板区域 (左上)
  { x: 30, y: 90, w: 160, h: 40 },
  // 阿尔瓦的书桌工位 (左中)
  { x: 80, y: 220, w: 180, h: 110 },
  // 赫尔曼的书桌工位 (右中)
  { x: 480, y: 220, w: 190, h: 110 },
  // 阿尔瓦人像占位
  { x: 140, y: 180, w: 40, h: 45 },
  // 赫尔曼人像占位
  { x: 550, y: 180, w: 45, h: 45 }
];

// 可互动的目标点
const interactables = [
  {
    id: 'herman',
    name: '赫尔曼·塞曼',
    x: 570, y: 220, dist: 60,
    color: '#10b981',
    dialogues: [
      "（赫尔曼一手端着冷咖啡，另一手正飞快敲着终端，头也没回）“……等等阿尔瓦，这里的迭代边界有问题。如果把它视作循环，它根本无法自洽闭环。”",
      "（他转过椅背，绿色眼睛带着点熬夜的笑意）“哪来的白猫？一身灰尘。赫尔曼叔叔可没带猫罐头，不过……那边窗台下的垫子随你趴，只要别去碰底下的蓝线。”",
      "（他拍了拍旁边那张堆满手稿的椅子）“阿尔瓦昨晚在黑板前站到四点，刚才把华夫饼晾在盘子里就又去调示波器了……你这小毛球要是闲着，替我监督他把早饭吃了。”"
    ]
  },
  {
    id: 'alva',
    name: '阿尔瓦·洛伦兹',
    x: 160, y: 220, dist: 60,
    color: '#60a5fa',
    dialogues: [
      "（阿尔瓦从密密麻麻的电路拓扑图上抬起眼，单边镜链随着动作微微晃动）“赫尔曼，你那套‘永动机’模型收敛了吗？要是还没收敛，就先别急着给机器通电。”",
      "（他注意到桌边探头探脑的白色绒球，神情瞬间柔和下来，伸手轻碰你的耳朵）“小家伙怎么摸进阁楼了？地板又凉又多灰……到妈妈膝盖上趴着，别乱跑。”",
      "（他轻声叹气，指了指桌角那盘枫糖华夫饼）“赫尔曼大清早排队买回来的，甜得发腻，我吃不惯……不过你这只馋猫，分你尝一小块倒无妨。”"
    ]
  },
  {
    id: 'waffle',
    name: '热腾腾的华夫饼盘',
    x: 230, y: 250, dist: 45,
    color: '#f59e0b',
    dialogues: [
      "盘子里放着赫尔曼大清早买回来的枫糖华夫饼，烤得金黄酥脆。虽然边缘已经有些微凉，但依然散发着浓郁诱人的甜香。"
    ]
  },
  {
    id: 'scope',
    name: '阴极射线示波器',
    x: 95, y: 245, dist: 50,
    color: '#4ade80',
    dialogues: [
      "绿荧荧的屏幕上一条正弦波，很稳。机壳侧面贴着一张标签纸，字写得很小很密。"
    ]
  },
  {
    id: 'hpc',
    name: '高性能原型机柜 (Perpetual Wheel #01)',
    x: 630, y: 240, dist: 60,
    color: '#a855f7',
    dialogues: [
      "风扇声压得很低，绿色和琥珀色的灯在暗处轮流亮。机箱外壳烫手，别贴上去。"
    ]
  },
  {
    id: 'blackboard',
    name: '写满推演公式的黑板',
    x: 110, y: 130, dist: 55,
    color: '#6ee7b7',
    dialogues: [
      "黑板上画着两人推演到深夜的环形分布式架构草图，右上角写着一句当年两人的共同信念：‘让技术真正属于每一个普通人’。"
    ]
  }
];

let activeDialogue = null;
let dialogueIndex = 0;

function handleInteract() {
  if (activeDialogue) {
    dialogueIndex++;
    if (dialogueIndex >= activeDialogue.dialogues.length) {
      activeDialogue = null;
      dialogBox.style.display = 'none';
    } else {
      dialogText.innerHTML = activeDialogue.dialogues[dialogueIndex];
    }
    return;
  }

  // 寻找最近的可互动对象
  for (const item of interactables) {
    const dx = (cat.x + cat.w/2) - item.x;
    const dy = (cat.y + cat.h/2) - item.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < item.dist) {
      activeDialogue = item;
      dialogueIndex = 0;
      dialogName.innerText = item.name;
      dialogName.style.color = item.color;
      dialogText.innerHTML = item.dialogues[0];
      dialogBox.style.display = 'block';
      break;
    }
  }
}

// 碰撞检测辅助
function checkCollision(nx, ny) {
  const catBox = { x: nx, y: ny, w: cat.w, h: cat.h };
  for (const c of colliders) {
    if (
      catBox.x < c.x + c.w &&
      catBox.x + catBox.w > c.x &&
      catBox.y < c.y + c.h &&
      catBox.y + catBox.h > c.y
    ) {
      return true;
    }
  }
  return false;
}

// 游戏主循环更新
let tick = 0;
function update() {
  tick++;
  if (!activeDialogue) {
    let dx = 0;
    let dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) { dx -= 1; cat.facing = -1; }
    if (keys['d'] || keys['arrowright']) { dx += 1; cat.facing = 1; }

    cat.moving = (dx !== 0 || dy !== 0);
    if (cat.moving) {
      cat.wagTime += 0.2;
      const len = Math.sqrt(dx*dx + dy*dy);
      const moveX = (dx / len) * cat.speed;
      const moveY = (dy / len) * cat.speed;

      if (!checkCollision(cat.x + moveX, cat.y)) cat.x += moveX;
      if (!checkCollision(cat.x, cat.y + moveY)) cat.y += moveY;
    } else {
      cat.wagTime += 0.05;
    }
  }
}

// 绘制实验室场景
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. 木质地板与砖墙基底
  ctx.fillStyle = '#1e1b18';
  ctx.fillRect(0, 100, canvas.width, canvas.height - 100);
  // 地板木纹接缝
  ctx.strokeStyle = '#27221e';
  ctx.lineWidth = 1.5;
  for (let y = 140; y < canvas.height; y += 38) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  // 2. 阁楼拱窗与黎明晨光
  ctx.fillStyle = '#141c2e';
  ctx.fillRect(0, 0, canvas.width, 100);

  // 拱窗
  ctx.save();
  const dawnGrad = ctx.createLinearGradient(330, 10, 330, 95);
  dawnGrad.addColorStop(0, '#1e1b4b');
  dawnGrad.addColorStop(0.6, '#384d75');
  dawnGrad.addColorStop(1, '#f59e0b');
  ctx.fillStyle = dawnGrad;
  ctx.beginPath();
  ctx.arc(400, 50, 60, Math.PI, 0);
  ctx.lineTo(460, 98);
  ctx.lineTo(340, 98);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 4;
  ctx.stroke();
  // 窗格
  ctx.beginPath();
  ctx.moveTo(400, 0); ctx.lineTo(400, 98);
  ctx.moveTo(340, 50); ctx.lineTo(460, 50);
  ctx.stroke();
  ctx.restore();

  // 斜射晨光
  ctx.save();
  const beamGrad = ctx.createLinearGradient(400, 50, 400, 480);
  beamGrad.addColorStop(0, 'rgba(254, 240, 138, 0.22)');
  beamGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
  ctx.fillStyle = beamGrad;
  ctx.beginPath();
  ctx.moveTo(340, 98); ctx.lineTo(460, 98);
  ctx.lineTo(600, 480); ctx.lineTo(200, 480);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 3. 黑板 (左上)
  ctx.fillStyle = '#1a2e22';
  ctx.fillRect(35, 30, 150, 65);
  ctx.strokeStyle = '#5c3a21';
  ctx.lineWidth = 4;
  ctx.strokeRect(35, 30, 150, 65);
  // 黑板粉笔图
  ctx.strokeStyle = '#86efac';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(80, 62, 16, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '9px monospace';
  ctx.fillText("PW / Ring Cluster", 102, 54);
  ctx.fillText("∇·E = ρ/ε₀", 102, 70);

  // 4. 高性能机柜 HPC (右上)
  ctx.fillStyle = '#0b0f19';
  ctx.fillRect(620, 80, 140, 180);
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2;
  ctx.strokeRect(620, 80, 140, 180);
  // 机柜单元槽与闪烁灯
  for (let i = 0; i < 5; i++) {
    const ry = 95 + i * 32;
    ctx.fillStyle = '#161f30';
    ctx.fillRect(630, ry, 120, 24);
    // 闪烁绿灯
    const blink = Math.sin(tick * 0.1 + i) > 0;
    ctx.fillStyle = blink ? '#22c55e' : '#14532d';
    ctx.beginPath(); ctx.arc(642, ry + 12, 3, 0, Math.PI * 2); ctx.fill();
    // 闪烁黄灯
    const amberBlink = Math.cos(tick * 0.08 + i) > 0.2;
    ctx.fillStyle = amberBlink ? '#f59e0b' : '#78350f';
    ctx.beginPath(); ctx.arc(652, ry + 12, 3, 0, Math.PI * 2); ctx.fill();
  }

  // 5. 地面粗排线 (从机柜蜿蜒到书桌)
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(630, 240);
  ctx.quadraticCurveTo(460, 360, 260, 270);
  ctx.stroke();
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(635, 245);
  ctx.quadraticCurveTo(455, 365, 260, 275);
  ctx.stroke();

  // 6. 左侧书桌：阿尔瓦的工位
  ctx.fillStyle = '#452817';
  ctx.fillRect(80, 220, 180, 90);
  ctx.fillStyle = '#5c361e';
  ctx.fillRect(75, 215, 190, 12);
  // 示波器
  ctx.fillStyle = '#334155';
  ctx.fillRect(90, 175, 52, 42);
  ctx.fillStyle = '#064e3b';
  ctx.fillRect(95, 180, 34, 26);
  // 示波器正弦波
  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = 0; x < 34; x++) {
    const sy = 193 + Math.sin((x + tick * 0.8) * 0.35) * 6;
    if (x === 0) ctx.moveTo(95 + x, sy); else ctx.lineTo(95 + x, sy);
  }
  ctx.stroke();
  // 算稿手稿
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(150, 196, 32, 22);
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(154, 202, 24, 2);
  ctx.fillRect(154, 208, 20, 2);
  // 华夫饼瓷盘
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath(); ctx.ellipse(215, 210, 18, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d97706';
  ctx.fillRect(205, 202, 20, 10);
  ctx.strokeStyle = '#92400e';
  ctx.lineWidth = 1;
  ctx.strokeRect(205, 202, 20, 10);

  // 7. 右侧书桌：赫尔曼的工位
  ctx.fillStyle = '#3d2415';
  ctx.fillRect(480, 220, 190, 90);
  ctx.fillStyle = '#52311c';
  ctx.fillRect(475, 215, 200, 12);
  // CRT 电脑主机与显示器
  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(500, 168, 56, 50);
  ctx.fillStyle = '#022c22';
  ctx.fillRect(506, 174, 44, 34);
  // 终端光标闪烁
  if (Math.sin(tick * 0.15) > 0) {
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(512, 182, 5, 8);
  }
  // 赫尔曼的大马克杯
  ctx.fillStyle = '#f1f5f9';
  ctx.fillRect(630, 200, 14, 18);
  ctx.fillStyle = '#451a03';
  ctx.beginPath(); ctx.ellipse(637, 200, 6, 2, 0, 0, Math.PI * 2); ctx.fill();

  // 8. 绘制角色：赫尔曼 (位于赫尔曼桌后或桌旁)
  drawHerman(570, 180);

  // 9. 绘制角色：阿尔瓦 (位于阿尔瓦桌后)
  drawAlva(160, 180);

  // 10. 交互光圈提示 (若靠近任何可交互对象)
  for (const item of interactables) {
    const dx = (cat.x + cat.w/2) - item.x;
    const dy = (cat.y + cat.h/2) - item.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < item.dist) {
      ctx.strokeStyle = item.color;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(item.x, item.y, 22 + Math.sin(tick * 0.1) * 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // 悬浮小气泡 [E 互动]
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(item.x - 30, item.y - 48, 60, 20);
      ctx.strokeStyle = item.color;
      ctx.strokeRect(item.x - 30, item.y - 48, 60, 20);
      ctx.fillStyle = '#ffffff';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText("[E] 查看", item.x, item.y - 34);
      break;
    }
  }

  // 11. 绘制主角：小白猫 (带翘尾巴与朝向翻转)
  drawCat(cat.x, cat.y, cat.facing, cat.wagTime);
}

// 绘制赫尔曼·塞曼：棕色短发、绿色眼睛、棕绿条纹西服、绿宝石领结口水巾
function drawHerman(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // 身体：棕绿色条纹西服
  ctx.fillStyle = '#2d4a22'; // 棕绿西装底色
  ctx.beginPath();
  ctx.roundRect(-22, 10, 44, 46, [6, 6, 0, 0]);
  ctx.fill();
  // 纵向深绿细条纹
  ctx.strokeStyle = '#1b3414';
  ctx.lineWidth = 2;
  for (let sx = -16; sx <= 16; sx += 8) {
    ctx.beginPath(); ctx.moveTo(sx, 10); ctx.lineTo(sx, 56); ctx.stroke();
  }

  // 白色衬衫前襟与口水巾领结 (Jabot / Ascot)
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.moveTo(-10, 10); ctx.lineTo(10, 10);
  ctx.lineTo(7, 28); ctx.lineTo(-7, 28);
  ctx.closePath();
  ctx.fill();
  // 领结皱褶
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, 10); ctx.lineTo(0, 26);
  ctx.moveTo(-5, 18); ctx.lineTo(5, 18);
  ctx.stroke();

  // 口水巾中央佩戴的绿宝石装饰
  ctx.fillStyle = '#10b981';
  ctx.beginPath();
  ctx.arc(0, 18, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#fbbf24'; // 金边镶嵌
  ctx.lineWidth = 1;
  ctx.stroke();

  // 头部轮廓
  ctx.fillStyle = '#fed7aa';
  ctx.beginPath();
  ctx.ellipse(0, -6, 15, 17, 0, 0, Math.PI * 2);
  ctx.fill();

  // 赫尔曼标志性：棕色短发
  ctx.fillStyle = '#5c3a21'; // 棕发
  ctx.beginPath();
  ctx.arc(0, -10, 16, Math.PI * 0.9, Math.PI * 2.1);
  ctx.lineTo(16, -4); ctx.lineTo(12, 0); ctx.lineTo(8, -6);
  ctx.lineTo(-4, -6); ctx.lineTo(-12, 0); ctx.lineTo(-16, -4);
  ctx.closePath();
  ctx.fill();

  // 绿色眼睛
  ctx.fillStyle = '#10b981';
  ctx.beginPath(); ctx.ellipse(-5, -6, 2.5, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, -6, 2.5, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-6, -7, 1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -7, 1, 0, Math.PI * 2); ctx.fill();

  // 嘴唇自信的微弧
  ctx.strokeStyle = '#9a3412';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, 0, 3.5, 0.1, Math.PI * 0.9); ctx.stroke();

  // 悬挂名字
  ctx.fillStyle = '#6ee7b7';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText("赫尔曼", 0, -28);

  ctx.restore();
}

// 绘制阿尔瓦·洛伦兹：灰白长发、低马尾垂左肩、金色单边眼镜、棕马甲白衬衫
function drawAlva(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // 身体：棕色马甲与白衬衫
  ctx.fillStyle = '#f8fafc'; // 白衬衫
  ctx.beginPath();
  ctx.roundRect(-20, 10, 40, 46, [6, 6, 0, 0]);
  ctx.fill();
  ctx.fillStyle = '#5c361e'; // 棕色马甲
  ctx.fillRect(-20, 16, 12, 40);
  ctx.fillRect(8, 16, 12, 40);

  // 垂在左肩膀上的灰白低马尾
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath();
  ctx.moveTo(10, 6);
  ctx.quadraticCurveTo(24, 24, 18, 48);
  ctx.quadraticCurveTo(12, 52, 10, 42);
  ctx.quadraticCurveTo(14, 20, 6, 10);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 头部轮廓
  ctx.fillStyle = '#fed7aa';
  ctx.beginPath();
  ctx.ellipse(0, -6, 15, 17, 0, 0, Math.PI * 2);
  ctx.fill();

  // 灰白色长发 (修长柔顺)
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath();
  ctx.arc(0, -9, 16.5, Math.PI * 0.85, Math.PI * 2.15);
  ctx.lineTo(16, 6); ctx.lineTo(11, 2); ctx.lineTo(7, -5);
  ctx.lineTo(-7, -5); ctx.lineTo(-11, 2); ctx.lineTo(-16, 6);
  ctx.closePath();
  ctx.fill();

  // 浅蓝色双眸
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath(); ctx.ellipse(-5, -6, 2.5, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, -6, 2.5, 3, 0, 0, Math.PI * 2); ctx.fill();

  // 右眼金色单边眼镜与金链
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(5, -6, 5.5, 0, Math.PI * 2);
  ctx.stroke();
  // 垂落金链
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(10.5, -6);
  ctx.quadraticCurveTo(16, 6, 8, 20);
  ctx.stroke();

  // 温和的微笑
  ctx.strokeStyle = '#b45309';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, 0, 3, 0.2, Math.PI * 0.8); ctx.stroke();

  // 名字标识
  ctx.fillStyle = '#93c5fd';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText("阿尔瓦", 0, -28);

  ctx.restore();
}

// 绘制主角：小白猫
function drawCat(cx, cy, facing, wag) {
  ctx.save();
  ctx.translate(cx + cat.w/2, cy + cat.h/2);
  if (facing === -1) {
    ctx.scale(-1, 1);
  }

  // 尾巴摇摆
  const tailRot = Math.sin(wag) * 0.35;
  ctx.save();
  ctx.translate(-10, 4);
  ctx.rotate(tailRot);
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-14, -12, -8, -20);
  ctx.quadraticCurveTo(-4, -12, 0, 0);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // 猫咪圆润身子
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.ellipse(0, 2, 14, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 猫咪脑袋
  ctx.beginPath();
  ctx.ellipse(8, -4, 10, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 耳朵
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(4, -11); ctx.lineTo(7, -19); ctx.lineTo(12, -12); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fbcfe8';
  ctx.beginPath();
  ctx.moveTo(5, -12); ctx.lineTo(7, -17); ctx.lineTo(10, -13); ctx.closePath();
  ctx.fill();

  // 蓝眼睛
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath(); ctx.arc(12, -4, 2.2, 0, Math.PI * 2); ctx.fill();

  // 粉鼻头
  ctx.fillStyle = '#f472b6';
  ctx.beginPath(); ctx.arc(16, -2, 1.2, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  // 玩家头顶小名字（不随缩放镜像翻转）
  ctx.fillStyle = '#f8fafc';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText("小雪球", cx + cat.w/2, cy - 8);
}

// 启动游戏循环
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
