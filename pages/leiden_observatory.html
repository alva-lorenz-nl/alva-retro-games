<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>莱顿天文台 · 那一晚的星星</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #07090f;
    font-family: "PingFang SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    box-shadow: 0 0 80px rgba(30,50,90,.5), 0 0 0 1px #1c2436;
    max-width: 100%; max-height: 100%;
  }
  #hint {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    color: #8fa4c4; font-size: 13px; letter-spacing: .08em;
    background: rgba(8,12,20,.78); padding: 7px 16px; border-radius: 20px;
    border: 1px solid #26324a; white-space: nowrap; pointer-events: none;
    transition: opacity .6s;
  }
  #dialog {
    position: absolute; left: 50%; bottom: 6%;
    transform: translateX(-50%) translateY(14px);
    width: min(700px, 88vw);
    background: linear-gradient(180deg, #eef2f8, #dbe3ee);
    border: 3px solid #3a4a66; border-radius: 10px;
    padding: 18px 22px 16px;
    box-shadow: 0 12px 44px rgba(0,0,0,.7);
    opacity: 0; pointer-events: none;
    transition: opacity .22s, transform .22s;
  }
  #dialog.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  #speaker {
    font-size: 15px; font-weight: 700; color: #2c3f5e;
    letter-spacing: .1em; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  #speaker::before {
    content: ""; width: 10px; height: 10px; background: #4a6a9a;
    transform: rotate(45deg); display: inline-block;
  }
  #text {
    font-size: 16px; line-height: 1.85; color: #1e2634;
    min-height: 62px; white-space: pre-wrap;
  }
  #next {
    text-align: right; font-size: 12px; color: #6a7a92;
    margin-top: 6px; letter-spacing: .1em;
    animation: bl 1.1s infinite;
  }
  @keyframes bl { 0%,100%{opacity:.35} 50%{opacity:1} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="416"></canvas>
  <div id="hint">WASD / 方向键 移动 · 靠近他们按 E 说话</div>
  <div id="dialog">
    <div id="speaker"></div>
    <div id="text"></div>
    <div id="next">E / 空格 继续</div>
  </div>
</div>
<script>
"use strict";

/* ============ 基础 ============ */
const TILE = 32;
const COLS = 20, ROWS = 13;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fit() {
  const s = Math.min(window.innerWidth / cv.width, window.innerHeight / cv.height);
  const k = Math.max(1, Math.floor(s));
  cv.style.width = (cv.width * k) + 'px';
  cv.style.height = (cv.height * k) + 'px';
}
window.addEventListener('resize', fit); fit();

/* ============ 地图 ============ */
// # 墙  . 地板  O 圆顶开口(星)  T 望远镜  R 栏杆  B 长椅  L 星图桌  W 窗
const MAP = [
  "####################",
  "#OOOOOOOOOOOOOOOOOO#",
  "#OOOOOOOOOOOOOOOOOO#",
  "#..................#",
  "#..................#",
  "#....T.............#",
  "#....T.......L.....#",
  "#..................#",
  "#..B..........B....#",
  "#..................#",
  "#WW..............WW#",
  "#..................#",
  "####################"
];

function tileAt(c, r) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return '#';
  return MAP[r][c];
}
function solid(c, r) {
  const t = tileAt(c, r);
  return t === '#' || t === 'T' || t === 'L' || t === 'B';
}

/* ============ 角色 ============ */
const player = {
  x: 10.0 * TILE, y: 10.4 * TILE,
  w: 18, h: 14,
  speed: 118,
  dir: 'up',
  step: 0
};

const npcs = [
  {
    id: 'herman',
    name: '赫尔曼·塞曼',
    x: 6.2 * TILE, y: 7.4 * TILE,
    color: '#6a5230',
    hair: '#5a3f1e',
    lines: [
      "（指着望远镜，语速很快）\n你看这个赤道仪，十九世纪的，齿轮还是手磨的。我下午给你讲了三个小时，它怎么跟着星星转。",
      "（忽然停下来，有点不好意思）\n……我好像又只顾着讲东西了。",
      "（转向她）阿尔维，你其实不想听这些吧。",
      "（很轻地）那你想听什么？我讲给你听。"
    ]
  },
  {
    id: 'alva',
    name: '阿尔瓦·洛伦兹',
    x: 8.4 * TILE, y: 7.4 * TILE,
    color: '#3a4658',
    hair: '#c9c4b8',
    lines: [
      "（靠在栏杆边，抬头看圆顶）\n讲得挺好。就是忘了问我想不想听。",
      "（顿了顿，没有责怪的意思）\n不过……你讲的时候，眼睛是亮的。这个我记住了。",
      "（低头看你，笑了一下）\n你继续吧，我听着。今天不催你。",
      "（伸手把外套往你肩上拉了拉）\n夜里凉。讲慢一点，我们有的是时间。"
    ]
  }
];

/* ============ 星空 ============ */
const stars = [];
(function initStars() {
  let seed = 20261102;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < 190; i++) {
    stars.push({
      x: rnd() * cv.width,
      y: rnd() * 150,
      r: rnd() < 0.85 ? 1 : 2,
      ph: rnd() * Math.PI * 2,
      sp: 0.6 + rnd() * 1.6,
      hue: rnd()
    });
  }
})();

/* ============ 输入 ============ */
const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if (k === 'e' || k === ' ') {
    if (dialogOpen) advanceDialog();
    else tryTalk();
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

/* ============ 对话 ============ */
const dlgEl = document.getElementById('dialog');
const spkEl = document.getElementById('speaker');
const txtEl = document.getElementById('text');
let dialogOpen = false;
let curLines = null, curIdx = 0, curName = '';

function tryTalk() {
  let best = null, bd = 1e9;
  for (const n of npcs) {
    const d = Math.hypot(n.x - player.x, n.y - player.y);
    if (d < bd) { bd = d; best = n; }
  }
  if (best && bd < 58) {
    curLines = best.lines; curIdx = 0; curName = best.name;
    dialogOpen = true;
    dlgEl.classList.add('show');
    document.getElementById('hint').style.opacity = '0';
    renderLine();
  }
}
function renderLine() {
  spkEl.textContent = curName;
  txtEl.textContent = curLines[curIdx];
}
function advanceDialog() {
  curIdx++;
  if (curIdx >= curLines.length) {
    dialogOpen = false;
    dlgEl.classList.remove('show');
    document.getElementById('hint').style.opacity = '1';
  } else renderLine();
}

/* ============ 更新 ============ */
function update(dt) {
  if (dialogOpen) return;
  let dx = 0, dy = 0;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;

  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? 'right' : 'left';
    else player.dir = dy > 0 ? 'down' : 'up';
    const sp = player.speed * dt;
    moveAxis(dx * sp, 0);
    moveAxis(0, dy * sp);
    player.step += dt * 9;
  } else player.step = 0;
}

function moveAxis(mx, my) {
  const nx = player.x + mx, ny = player.y + my;
  const hw = player.w / 2, hh = player.h / 2;
  const c1 = Math.floor((nx - hw) / TILE), c2 = Math.floor((nx + hw - 0.01) / TILE);
  const r1 = Math.floor((ny - hh) / TILE), r2 = Math.floor((ny + hh - 0.01) / TILE);
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++)
      if (solid(c, r)) return;
  player.x = nx; player.y = ny;
}

/* ============ 绘制 ============ */
function drawSky(t) {
  // 夜空渐变
  const g = ctx.createLinearGradient(0, 0, 0, 170);
  g.addColorStop(0, '#070b16');
  g.addColorStop(0.55, '#0d1526');
  g.addColorStop(1, '#16203a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cv.width, 170);

  // 银河
  ctx.save();
  ctx.globalAlpha = 0.16;
  const mg = ctx.createLinearGradient(0, 40, cv.width, 120);
  mg.addColorStop(0, 'rgba(90,120,190,0)');
  mg.addColorStop(0.5, 'rgba(140,170,230,1)');
  mg.addColorStop(1, 'rgba(90,120,190,0)');
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.ellipse(cv.width/2, 78, cv.width*0.62, 26, -0.06, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // 星星
  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
    ctx.globalAlpha = tw;
    if (s.hue > 0.9) ctx.fillStyle = '#ffd9a0';
    else if (s.hue > 0.78) ctx.fillStyle = '#a8c8ff';
    else ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(s.x), Math.round(s.y), s.r, s.r);
    if (s.r === 2) {
      ctx.globalAlpha = tw * 0.35;
      ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y), 4, 1);
      ctx.fillRect(Math.round(s.x), Math.round(s.y) - 1, 1, 4);
    }
  }
  ctx.globalAlpha = 1;
}

function drawFloor() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = MAP[r][c];
      const x = c * TILE, y = r * TILE;
      if (t === '#') {
        ctx.fillStyle = '#10141e';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#1a2030';
        ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      } else if (t === 'O') {
        // 圆顶开口：透明，露出星空（已在 drawSky 画过）
        ctx.fillStyle = 'rgba(8,12,22,.15)';
        ctx.fillRect(x, y, TILE, TILE);
      } else {
        // 石地板
        const alt = (c + r) % 2 === 0;
        ctx.fillStyle = alt ? '#2a3040' : '#262c3a';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = 'rgba(255,255,255,.03)';
        ctx.fillRect(x, y, TILE, 1);
        ctx.fillRect(x, y, 1, TILE);
      }
    }
  }
}

function drawProps(t) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ty = MAP[r][c];
      const x = c * TILE, y = r * TILE;

      if (ty === 'T') {
        // 望远镜底座
        ctx.fillStyle = '#2c3444';
        ctx.fillRect(x + 8, y + 16, 16, 14);
        ctx.fillStyle = '#3a4458';
        ctx.fillRect(x + 10, y + 18, 12, 10);
        // 镜筒（斜向上）
        ctx.save();
        ctx.translate(x + 16, y + 16);
        ctx.rotate(-0.62);
        ctx.fillStyle = '#4a5670';
        ctx.fillRect(-5, -26, 10, 30);
        ctx.fillStyle = '#5d6b88';
        ctx.fillRect(-5, -26, 10, 4);
        ctx.fillStyle = '#8fa8c8';
        ctx.fillRect(-4, -27, 8, 2);
        ctx.restore();
        // 齿轮
        ctx.strokeStyle = '#6a7a96';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x + 16, y + 22, 6, 0, Math.PI * 2);
        ctx.stroke();
      } else if (ty === 'L') {
        // 星图桌
        ctx.fillStyle = '#3a3020';
        ctx.fillRect(x + 2, y + 10, TILE - 4, TILE - 14);
        ctx.fillStyle = '#5a4a2e';
        ctx.fillRect(x + 2, y + 8, TILE - 4, 5);
        // 星图纸
        ctx.fillStyle = '#c8c0a8';
        ctx.fillRect(x + 6, y + 4, TILE - 12, 10);
        ctx.fillStyle = '#3a3020';
        ctx.fillRect(x + 10, y + 7, 1, 1);
        ctx.fillRect(x + 15, y + 6, 1, 1);
        ctx.fillRect(x + 19, y + 9, 1, 1);
      } else if (ty === 'B') {
        // 长椅
        ctx.fillStyle = '#3a2e1e';
        ctx.fillRect(x + 2, y + 12, TILE - 4, 10);
        ctx.fillStyle = '#54432a';
        ctx.fillRect(x + 2, y + 10, TILE - 4, 5);
        ctx.fillStyle = '#2a2014';
        ctx.fillRect(x + 4, y + 22, 3, 8);
        ctx.fillRect(x + TILE - 7, y + 22, 3, 8);
      } else if (ty === 'W') {
        // 窗：外面是夜色
        ctx.fillStyle = '#0d1526';
        ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
        ctx.fillStyle = '#2a3a56';
        ctx.fillRect(x + 3, y + 3, TILE - 6, 2);
        ctx.fillStyle = '#6a7a96';
        ctx.fillRect(x + TILE / 2 - 1, y + 3, 2, TILE - 6);
      }
    }
  }

  // 栏杆（在开口下方一排）
  ctx.fillStyle = '#4a5670';
  for (let c = 1; c < COLS - 1; c++) {
    const x = c * TILE;
    ctx.fillRect(x + 14, 2 * TILE + 4, 4, 14);
  }
  ctx.fillRect(TILE, 2 * TILE + 2, (COLS - 2) * TILE, 4);
}

function drawCat(x, y, t) {
  const bob = Math.sin(t * 9) * 1.2;
  const px = Math.round(x), py = Math.round(y + bob);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(px, py + 8, 11, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  // 尾巴
  ctx.strokeStyle = '#f2f0ea';
  ctx.lineWidth = 3;
  ctx.beginPath();
  const tw = Math.sin(t * 4) * 4;
  ctx.moveTo(px - 8, py + 2);
  ctx.quadraticCurveTo(px - 16, py - 4 + tw, px - 12, py - 10 + tw);
  ctx.stroke();
  // 身体
  ctx.fillStyle = '#f7f5ef';
  ctx.fillRect(px - 8, py - 4, 16, 12);
  // 头
  ctx.fillStyle = '#fbfaf5';
  ctx.fillRect(px - 7, py - 13, 14, 11);
  // 耳朵
  ctx.beginPath();
  ctx.moveTo(px - 7, py - 13); ctx.lineTo(px - 5, py - 19); ctx.lineTo(px - 1, py - 13);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(px + 7, py - 13); ctx.lineTo(px + 5, py - 19); ctx.lineTo(px + 1, py - 13);
  ctx.fill();
  ctx.fillStyle = '#e8b9b0';
  ctx.fillRect(px - 5, py - 16, 2, 2);
  ctx.fillRect(px + 3, py - 16, 2, 2);
  // 眼睛（夜里是亮的）
  ctx.fillStyle = '#5ad6a8';
  ctx.fillRect(px - 5, py - 10, 2, 3);
  ctx.fillRect(px + 3, py - 10, 2, 3);
  ctx.fillStyle = '#e8a0a0';
  ctx.fillRect(px - 1, py - 6, 2, 2);
}

function drawNPC(n, t) {
  const px = Math.round(n.x), py = Math.round(n.y);
  const bob = Math.sin(t * 2 + (n.id === 'herman' ? 0 : 1.7)) * 1.0;
  const y = py + bob;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(px, py + 14, 12, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  // 腿
  ctx.fillStyle = '#1e2430';
  ctx.fillRect(px - 6, y + 4, 5, 10);
  ctx.fillRect(px + 1, y + 4, 5, 10);
  // 身体
  ctx.fillStyle = n.color;
  ctx.fillRect(px - 8, y - 10, 16, 16);
  ctx.fillStyle = '#dfe4ec';
  ctx.fillRect(px - 2, y - 10, 4, 12);
  ctx.fillStyle = '#4a8a5a';
  ctx.fillRect(px - 1, y - 7, 2, 2);
  // 头
  ctx.fillStyle = '#e8c9a8';
  ctx.fillRect(px - 6, y - 22, 12, 12);
  ctx.fillStyle = n.hair;
  ctx.fillRect(px - 6, y - 24, 12, 5);
  ctx.fillRect(px - 7, y - 22, 2, 6);
  ctx.fillRect(px + 5, y - 22, 2, 6);
  ctx.fillStyle = '#2a2018';
  ctx.fillRect(px - 4, y - 17, 2, 2);
  ctx.fillRect(px + 2, y - 17, 2, 2);
  if (n.id === 'alva') {
    ctx.strokeStyle = '#c9c4b8';
    ctx.lineWidth = 1;
    ctx.strokeRect(px - 5.5, y - 18.5, 4, 4);
    ctx.strokeRect(px + 1.5, y - 18.5, 4, 4);
    ctx.beginPath();
    ctx.moveTo(px - 1.5, y - 16.5); ctx.lineTo(px + 1.5, y - 16.5);
    ctx.stroke();
  }
}

function drawVignette() {
  const g = ctx.createRadialGradient(cv.width/2, cv.height*0.45, cv.height*0.28, cv.width/2, cv.height*0.45, cv.height*0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(2,4,10,.62)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cv.width, cv.height);
}

/* ============ 主循环 ============ */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const t = now / 1000;

  update(dt);

  ctx.clearRect(0, 0, cv.width, cv.height);
  drawSky(t);
  drawFloor();
  drawProps(t);

  const ents = [
    { y: player.y, draw: () => drawCat(player.x, player.y, t) },
    ...npcs.map(n => ({ y: n.y, draw: () => drawNPC(n, t) }))
  ].sort((a, b) => a.y - b.y);
  ents.forEach(e => e.draw());

  drawVignette();

  if (!dialogOpen) {
    for (const n of npcs) {
      if (Math.hypot(n.x - player.x, n.y - player.y) < 58) {
        ctx.fillStyle = 'rgba(238,242,248,.94)';
        ctx.fillRect(n.x - 26, n.y - 40, 52, 15);
        ctx.fillStyle = '#2c3f5e';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('E 说话', n.x, n.y - 29);
        ctx.textAlign = 'left';
        break;
      }
    }
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

cv.addEventListener('click', () => { if (dialogOpen) advanceDialog(); });
</script>
</body>
</html>
